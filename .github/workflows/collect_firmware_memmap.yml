name: Firmware Memmap Collector CI

on:
  push:
    branches: [ main, master ]
    paths:
      - "scripts/collect_firmware_memmap.sh"
      - ".github/workflows/collect_firmware_memmap.yml"
  pull_request:
    paths:
      - "scripts/collect_firmware_memmap.sh"
      - ".github/workflows/collect_firmware_memmap.yml"
  workflow_dispatch:

jobs:
  # 1) GitHub-hosted Ubuntu 직접 테스트
  ubuntu-native:
    name: Ubuntu native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            procps \
            sysstat \
            iproute2 \
            ethtool \
            util-linux \
            gawk \
            grep \
            sed \
            coreutils

      - name: Debug workspace
        run: |
          pwd
          ls -R

      - name: Make scripts executable
        run: chmod +x scripts/*.sh  

      - name: Syntax check
        run: |
          bash -n scripts/collect_firmware_memmap_portable.sh
    
      - name: Run firmware_memmap collector
        run: |
          mkdir -p out/ubuntu
          ./scripts/collect_firmware_memmap_portable.sh out/ubuntu/firmware_memmap.log

      - name: Validate output files
        run: |
          test -f out/ubuntu/firmware_memmap.log

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.os }}-artifacts
          path: out/ubuntu/
