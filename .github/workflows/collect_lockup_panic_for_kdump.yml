name: Lockup Panic For Kdump CI

on:
  push:
    branches: [ main, master ]
    paths:
      - "scripts/enable_lockup_panic_for_kdump.sh"
      - ".github/workflows/collect_lockup_panic_for_kdump.yml"

  pull_request:
    paths:
      - "scripts/enable_lockup_panic_for_kdump.sh"
      - ".github/workflows/collect_lockup_panic_for_kdump.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  SCRIPT_PATH: scripts/enable_lockup_panic_for_kdump.sh

jobs:

  ubuntu-native:
    name: Ubuntu native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Prepare script
        run: |
          sed -i 's/\r$//' "${{ env.SCRIPT_PATH }}"
          chmod +x "${{ env.SCRIPT_PATH }}"
          sh -n "${{ env.SCRIPT_PATH }}"

      - name: Verify script metadata
        run: |
          head -100 "${{ env.SCRIPT_PATH }}"

      - name: Verify referenced kernel paths
        run: |
          ls -l /proc/sys/kernel/watchdog || true
          ls -l /proc/sys/kernel/watchdog_thresh || true
          ls -l /proc/sys/kernel/softlockup_panic || true
          ls -l /proc/sys/kernel/hung_task_timeout_secs || true
          ls -l /proc/sys/kernel/hung_task_panic || true

      - name: Run non-root validation
        run: |
          set +e
          "${{ env.SCRIPT_PATH }}"
          RC=$?
          echo "exit_code=$RC"
          test "$RC" -ne 0

      - name: Check script functions exist
        run: |
          grep -n "require_root" "${{ env.SCRIPT_PATH }}"
          grep -n "check_kdump" "${{ env.SCRIPT_PATH }}"
          grep -n "show_current" "${{ env.SCRIPT_PATH }}"
          grep -n "apply_settings" "${{ env.SCRIPT_PATH }}"
          grep -n "verify_settings" "${{ env.SCRIPT_PATH }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockup-kdump-${{ matrix.os }}
          path: scripts/enable_lockup_panic_for_kdump.sh
          if-no-files-found: warn

  linux-container-matrix:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:

          - name: rockylinux-8
            image: rockylinux:8
            install: |
              dnf install -y \
                bash \
                grep \
                sed \
                util-linux

          - name: rockylinux-9
            image: rockylinux:9
            install: |
              dnf install -y \
                bash \
                grep \
                sed \
                util-linux

          - name: debian-11
            image: debian:11
            install: |
              apt-get update
              apt-get install -y bash grep sed coreutils util-linux

          - name: debian-12
            image: debian:12
            install: |
              apt-get update
              apt-get install -y bash grep sed coreutils util-linux

          - name: oraclelinux-8
            image: oraclelinux:8
            install: |
              dnf install -y bash grep sed coreutils util-linux

          - name: oraclelinux-9
            image: oraclelinux:9
            install: |
              dnf install -y bash grep sed coreutils util-linux

          - name: suse-15-sp6
            image: registry.suse.com/bci/bci-base:15.6
            install: |
              zypper --non-interactive refresh
              zypper --non-interactive install bash grep sed coreutils util-linux

    container:
      image: ${{ matrix.image }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          ${{ matrix.install }}

      - name: Prepare script
        run: |
          sed -i 's/\r$//' "${{ env.SCRIPT_PATH }}"
          chmod +x "${{ env.SCRIPT_PATH }}"
          sh -n "${{ env.SCRIPT_PATH }}"

      - name: Verify script metadata
        run: |
          head -100 "${{ env.SCRIPT_PATH }}"

      - name: Verify kernel files
        run: |
          ls -l /proc/sys/kernel/watchdog || true
          ls -l /proc/sys/kernel/watchdog_thresh || true
          ls -l /proc/sys/kernel/softlockup_panic || true
          ls -l /proc/sys/kernel/hung_task_timeout_secs || true
          ls -l /proc/sys/kernel/hung_task_panic || true

      - name: Execute non-root validation
        run: |
          set +e
          "${{ env.SCRIPT_PATH }}"
          RC=$?
          echo "exit_code=$RC"
          test "$RC" -ne 0

      - name: Verify function declarations
        run: |
          grep -n "require_root" "${{ env.SCRIPT_PATH }}"
          grep -n "check_kdump" "${{ env.SCRIPT_PATH }}"
          grep -n "show_current" "${{ env.SCRIPT_PATH }}"
          grep -n "apply_settings" "${{ env.SCRIPT_PATH }}"
          grep -n "verify_settings" "${{ env.SCRIPT_PATH }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockup-kdump-${{ matrix.name }}
          path: scripts/enable_lockup_panic_for_kdump.sh
          if-no-files-found: warn
