name: LinuxToolBox Orchestrator CI

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/*.sh"
      - ".github/workflows/linux_toolbox_orchestrator.yml"
  pull_request:
    paths:
      - "scripts/*.sh"
      - ".github/workflows/linux_toolbox_orchestrator.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Collector profile
        required: false
        default: smoke
        type: choice
        options: [smoke, basic, detail, full]
      only:
        description: "Comma-separated collectors, optional"
        required: false
        default: ""
      enable_tcpdump:
        description: Run tcpdump collector
        required: false
        default: false
        type: boolean

concurrency:
  group: linux-toolbox-orchestrator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ORCH_PATH: scripts/run_linux_toolbox_collectors.sh

jobs:
  ubuntu-native:
    name: Ubuntu native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash coreutils findutils gawk grep sed procps util-linux iproute2 ethtool psmisc lsof tar gzip sysstat numactl pciutils nfs-common cifs-utils samba-common-bin rpcbind tcpdump kmod

      - name: Prepare scripts
        run: |
          find scripts -name '*.sh' -type f -exec sed -i 's/\r$//' {} \;
          find scripts -name '*.sh' -type f -exec chmod +x {} \;
          bash -n "${{ env.ORCH_PATH }}"

      - name: List collectors
        run: "${{ env.ORCH_PATH }} --list"

      - name: Dry run all
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --dry-run --continue-on-error --exclude tcpdump -o out/${{ matrix.os }}/dry-run

      - name: Smoke all safe collectors
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --exclude tcpdump -o out/${{ matrix.os }}/smoke-all

      - name: CPU and memory subset
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --only vmstat,mpstat,meminfo,iomem -o out/${{ matrix.os }}/cpu-memory

      - name: Network subset
        run: |
          IFACE=$(ip -o link show | awk -F': ' '$2 != "lo" {sub(/@.*/, "", $2); print $2; exit}')
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --only socket,softnet,rpc_nfs_cifs --softnet-ifaces "$IFACE" --socket-ports 22,80,443 --rpc-ports 111,2049,445,139,20048 -o out/${{ matrix.os }}/network

      - name: Lockup kdump validation only
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --only lockup_kdump -o out/${{ matrix.os }}/lockup-validation

      - name: Optional tcpdump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tcpdump == true }}
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --only tcpdump --enable-tcpdump --tcpdump-iface auto --tcpdump-filter 'port 22 or port 443' -o out/${{ matrix.os }}/tcpdump

      - name: Manual selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.only != '' }}
        run: |
          "${{ env.ORCH_PATH }}" --profile "${{ inputs.profile }}" --continue-on-error --only "${{ inputs.only }}" -o out/${{ matrix.os }}/manual

      - name: Package artifacts
        if: always()
        run: tar -czf linux-toolbox-${{ matrix.os }}.tar.gz out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-toolbox-${{ matrix.os }}
          path: linux-toolbox-${{ matrix.os }}.tar.gz
          if-no-files-found: warn

  linux-container-matrix:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rockylinux-8
            image: rockylinux:8
            install: |
              dnf install -y bash findutils gawk grep sed procps-ng util-linux iproute ethtool psmisc lsof tar gzip pciutils nfs-utils cifs-utils samba-client rpcbind kmod
              dnf install -y sysstat numactl tcpdump || true
          - name: rockylinux-9
            image: rockylinux:9
            install: |
              dnf install -y bash findutils gawk grep sed procps-ng util-linux iproute ethtool psmisc lsof tar gzip pciutils nfs-utils cifs-utils samba-client rpcbind kmod
              dnf install -y sysstat numactl tcpdump || true
          - name: debian-11
            image: debian:11
            install: |
              apt-get update
              apt-get install -y bash coreutils findutils gawk grep sed procps util-linux iproute2 ethtool psmisc lsof tar gzip sysstat numactl pciutils nfs-common cifs-utils samba-common-bin rpcbind tcpdump kmod
          - name: debian-12
            image: debian:12
            install: |
              apt-get update
              apt-get install -y bash coreutils findutils gawk grep sed procps util-linux iproute2 ethtool psmisc lsof tar gzip sysstat numactl pciutils nfs-common cifs-utils samba-common-bin rpcbind tcpdump kmod
          - name: oraclelinux-8
            image: oraclelinux:8
            install: |
              dnf install -y bash findutils gawk grep sed procps-ng util-linux iproute ethtool psmisc lsof tar gzip pciutils nfs-utils cifs-utils samba-client rpcbind kmod
              dnf install -y sysstat numactl tcpdump || true
          - name: oraclelinux-9
            image: oraclelinux:9
            install: |
              dnf install -y bash findutils gawk grep sed procps-ng util-linux iproute ethtool psmisc lsof tar gzip pciutils nfs-utils cifs-utils samba-client rpcbind kmod
              dnf install -y sysstat numactl tcpdump || true
          - name: suse-15-sp6
            image: registry.suse.com/bci/bci-base:15.6
            install: |
              zypper --non-interactive refresh
              zypper --non-interactive install bash coreutils findutils gawk grep sed procps util-linux iproute2 ethtool psmisc lsof tar gzip pciutils nfs-client cifs-utils samba-client rpcbind kmod sysstat numactl tcpdump
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Prepare scripts
        run: |
          find scripts -name '*.sh' -type f -exec sed -i 's/\r$//' {} \;
          find scripts -name '*.sh' -type f -exec chmod +x {} \;
          bash -n "${{ env.ORCH_PATH }}"

      - name: List collectors
        run: "${{ env.ORCH_PATH }} --list"

      - name: Dry run all
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --dry-run --continue-on-error --exclude tcpdump -o out/${{ matrix.name }}/dry-run

      - name: Smoke all safe collectors
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --exclude tcpdump -o out/${{ matrix.name }}/smoke-all

      - name: CPU and memory subset
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --only vmstat,mpstat,meminfo,iomem -o out/${{ matrix.name }}/cpu-memory

      - name: Network subset
        run: |
          IFACE=$(ip -o link show 2>/dev/null | awk -F': ' '$2 != "lo" {sub(/@.*/, "", $2); print $2; exit}')
          [ -n "$IFACE" ] || IFACE=lo
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --only socket,softnet,rpc_nfs_cifs --softnet-ifaces "$IFACE" --socket-ports 22,80,443 --rpc-ports 111,2049,445,139,20048 -o out/${{ matrix.name }}/network

      - name: Lockup kdump validation only
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --only lockup_kdump -o out/${{ matrix.name }}/lockup-validation

      - name: Optional tcpdump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tcpdump == true }}
        run: |
          "${{ env.ORCH_PATH }}" --profile smoke --continue-on-error --only tcpdump --enable-tcpdump --tcpdump-iface auto --tcpdump-filter 'port 22 or port 443' -o out/${{ matrix.name }}/tcpdump

      - name: Manual selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.only != '' }}
        run: |
          "${{ env.ORCH_PATH }}" --profile "${{ inputs.profile }}" --continue-on-error --only "${{ inputs.only }}" -o out/${{ matrix.name }}/manual

      - name: Package artifacts
        if: always()
        run: tar -czf linux-toolbox-${{ matrix.name }}.tar.gz out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-toolbox-${{ matrix.name }}
          path: linux-toolbox-${{ matrix.name }}.tar.gz
          if-no-files-found: warn
